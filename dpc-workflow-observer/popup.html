<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DPC Workflow Observer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f8f9fa;
      color: #212529;
      width: 300px;
      min-height: 120px;
    }

    header {
      background: #1a6b4a;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .section {
      padding: 10px 14px;
      border-bottom: 1px solid #e9ecef;
    }

    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6c757d;
      margin-bottom: 4px;
    }

    .value {
      font-size: 13px;
      font-weight: 500;
      color: #212529;
    }

    .value.muted { color: #adb5bd; font-weight: 400; font-style: italic; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      background: #e8f5ee;
      color: #1a6b4a;
    }

    .stats {
      display: flex;
      gap: 0;
    }

    .stat {
      flex: 1;
      padding: 10px 14px;
      border-right: 1px solid #e9ecef;
      text-align: center;
    }

    .stat:last-child { border-right: none; }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: #1a6b4a;
      line-height: 1;
    }

    .stat-label {
      font-size: 10px;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }

    footer {
      padding: 8px 14px;
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      background: #fff;
      color: #495057;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #f1f3f5; }

    button.primary {
      background: #1a6b4a;
      color: #fff;
      border-color: #1a6b4a;
    }

    button.primary:hover { background: #155c3e; }
  </style>
</head>
<body>
  <header>
    <h1>DPC Workflow Observer</h1>
    <div class="dot" id="dot"></div>
  </header>

  <div class="section">
    <div class="label">Currently tracking</div>
    <div class="value" id="current-tool"><span class="muted">No recognized tool active</span></div>
  </div>

  <div class="section">
    <div class="label">Patient context</div>
    <div class="value" id="current-patient"><span class="muted">None detected</span></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="stat-events">—</div>
      <div class="stat-label">Events today</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-patients">—</div>
      <div class="stat-label">Patients</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-tools">—</div>
      <div class="stat-label">Tools used</div>
    </div>
  </div>

  <footer>
    <button class="primary" id="btn-dashboard">View Dashboard</button>
    <button id="btn-options">Settings</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
