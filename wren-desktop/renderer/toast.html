<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: #e8eaf6;
      padding: 10px;
      cursor: pointer;
      -webkit-app-region: drag;
    }

    #card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 11px 13px 9px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    #header {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    #dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #wren-name {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      flex: 1;
    }

    #dismiss {
      color: #7b82a8;
      font-size: 13px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    #dismiss:hover { background: #22263a; color: #e8eaf6; }

    #message {
      font-size: 12px;
      line-height: 1.45;
      color: #c8cbe8;
      flex: 1;
    }

    #progress-track {
      height: 2px;
      background: #2d3148;
      border-radius: 1px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      border-radius: 1px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="header">
      <div id="dot"></div>
      <span id="wren-name">Lucas</span>
      <span id="dismiss">✕</span>
    </div>
    <div id="message"></div>
    <div id="progress-track">
      <div id="progress-bar"></div>
    </div>
  </div>
  <script src="toast.js"></script>
</body>
</html>
