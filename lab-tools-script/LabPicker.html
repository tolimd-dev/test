<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #fff;
      color: #212529;
    }

    #search-wrap {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 10px 10px 8px;
      border-bottom: 1px solid #e5e7eb;
      z-index: 10;
    }

    #search {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 13px;
      outline: none;
    }

    #search:focus { border-color: #1a6b4a; box-shadow: 0 0 0 2px rgba(26,107,74,0.15); }

    #count {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 5px;
      padding-left: 2px;
    }

    #list {
      list-style: none;
      padding: 4px 0;
    }

    #list li {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    #list li:hover { background: #f0f4f1; }

    #list li:active { background: #d1e8db; }

    .lab-name { flex: 1; font-size: 13px; color: #111827; }

    .lab-cost {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    #empty {
      padding: 24px 12px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      display: none;
    }

    #error {
      padding: 14px 12px;
      color: #b91c1c;
      font-size: 12px;
      background: #fee2e2;
      border-radius: 5px;
      margin: 10px;
      display: none;
    }

    #loading {
      padding: 24px 12px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
    }

    .inserted-flash {
      animation: flash 0.4s ease;
    }

    @keyframes flash {
      0%   { background: #d1fae5; }
      100% { background: transparent; }
    }
  </style>
</head>
<body>

<div id="search-wrap">
  <input id="search" type="text" placeholder="Search labs…" autocomplete="off" />
  <div id="count"></div>
</div>

<div id="error"></div>
<div id="loading">Loading labs…</div>
<ul id="list"></ul>
<div id="empty">No labs match.</div>

<script>
  var allLabs = [];

  function showError(msg) {
    var el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
  }

  function renderList(labs) {
    var ul = document.getElementById('list');
    ul.innerHTML = '';
    var empty = document.getElementById('empty');

    if (labs.length === 0) {
      empty.style.display = 'block';
      document.getElementById('count').textContent = '';
      return;
    }

    empty.style.display = 'none';

    var q = document.getElementById('search').value.trim();
    var total = allLabs.length;
    document.getElementById('count').textContent =
      q ? labs.length + ' of ' + total + ' labs' : total + ' labs';

    labs.forEach(function(lab) {
      var li = document.createElement('li');
      li.title = lab.notes || lab.name;

      var nameSpan = document.createElement('span');
      nameSpan.className = 'lab-name';
      nameSpan.textContent = lab.name;

      var costSpan = document.createElement('span');
      costSpan.className = 'lab-cost';
      costSpan.textContent = lab.cost || '';

      li.appendChild(nameSpan);
      li.appendChild(costSpan);

      li.addEventListener('click', function() {
        insertLab(lab.name, li);
      });

      ul.appendChild(li);
    });
  }

  function filterLabs(query) {
    if (!query) return allLabs;
    var q = query.toLowerCase();
    return allLabs.filter(function(lab) {
      return lab.name.toLowerCase().indexOf(q) !== -1 ||
             (lab.notes && lab.notes.toLowerCase().indexOf(q) !== -1);
    });
  }

  document.getElementById('search').addEventListener('input', function() {
    renderList(filterLabs(this.value.trim()));
  });

  function insertLab(name, li) {
    google.script.run
      .withSuccessHandler(function() {
        // Brief visual confirmation on the clicked item
        li.classList.add('inserted-flash');
        setTimeout(function() { li.classList.remove('inserted-flash'); }, 400);
        // Keep focus on search so user can quickly pick another
        document.getElementById('search').focus();
      })
      .withFailureHandler(function(err) {
        showError('Insert failed: ' + err.message);
      })
      .insertLabAtCursor(name);
  }

  // Load labs on open
  google.script.run
    .withSuccessHandler(function(labs) {
      document.getElementById('loading').style.display = 'none';
      allLabs = labs;
      renderList(labs);
      document.getElementById('search').focus();
    })
    .withFailureHandler(function(err) {
      showError(err.message);
    })
    .getLabList();
</script>
</body>
</html>
